version: "3.9"
services:


  postgres:
    image: postgres:15-alpine
    volumes: ["pg_data:/var/lib/postgresql/data"]
    environment:
      POSTGRES_DB: libe_aios
      POSTGRES_USER: libe
      POSTGRES_PASSWORD: libepass
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libe -d libe_aios"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DATABASE_URL: "postgresql://libe:libepass@postgres:5432/libe_aios"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
    ports: ["5435:5433"]
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    environment:
      # S-01 FIX: Override these in production! Do NOT use defaults.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"

volumes:
  pg_data:
  minio_data:
