# Production Docker Compose for Libe Aios
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/liberico-ai/ai-together:latest
    restart: unless-stopped
    ports:
      - "7060:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: libe-aios
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      - minio
    networks:
      - libe_net

  cron:
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    networks:
      - libe_net
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache curl >/dev/null 2>&1
        echo '30 1 * * * curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/telegram-daily-standup >> /proc/1/fd/1 2>&1' > /etc/crontabs/root
        echo "[cron] Registered: 30 1 * * * UTC (08:30 Asia/Ho_Chi_Minh) telegram-daily-standup"
        exec crond -f -l 8

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - libe_net
    ports:
      - "7061:9000" 
    expose:
      - "9000"
      - "9001"

networks:
  libe_net:
    driver: bridge

volumes:
  minio_data:
